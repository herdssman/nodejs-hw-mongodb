tags:
  - contacts
summary: Delete a Contact
operationId: deleteContact
description: Delete a contact by their ID
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 68f7cfa3f056bcb7beb2fcf3

responses:
  '204':
    description: Contact successfully deleted
    content: {}

  '400':
    $ref: ../../../components/responses/400.yaml

  '401':
    $ref: ../../../components/responses/401.yaml

  '404':
    description: Not Found Error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Not Found Error
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Contact not found

  '500':
    $ref: ../../../components/responses/500.yaml
