tags:
  - contacts
summary: Create a Contact
operationId: createContact
description: Create a new contact with the provided details
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        $ref: ../../components/schemas/createContact.yaml

responses:
  '201':
    description: Contact is created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/createContact.yaml

  '400':
    $ref: '../../components/responses/400.yaml'

  '401':
    $ref: '../../components/responses/401.yaml'

  '500':
    $ref: '../../components/responses/500.yaml'
