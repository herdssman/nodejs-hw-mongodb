<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password email</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 600px; background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);">
                    <tr>
                        <td align="center" style="padding-bottom: 20px;">
                            <h1 style="color: #2c3e50; font-size: 24px; margin: 0;">Hello, {{name}} 👋</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="color: #555555; font-size: 16px; line-height: 1.5; padding-bottom: 30px;">
                            <p style="margin: 0;">We received a request to reset your password.</p>
                            <p style="margin: 10px 0 0;">Click the button below to continue:</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <a href="{{link}}"
                                style="background-color: #007bff; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; display: inline-block; font-weight: bold;">
                                Reset Password
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="color: #888888; font-size: 12px; line-height: 1.4; text-align: center;">
                            <p style="margin: 0;">If you didn’t request a password reset, you can safely ignore this
                                email.</p>
                            <p style="margin-top: 8px;">This link will expire in 5 minutes.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>


</html>
